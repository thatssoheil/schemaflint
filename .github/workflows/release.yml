name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: node
          # PAT (not GITHUB_TOKEN) so the tag/release this action creates
          # PROPAGATES downstream (github suppresses workflows triggered by
          # GITHUB_TOKEN-created events, which is why publish.yml never fired).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
